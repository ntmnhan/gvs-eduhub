<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVS Eduhub - Điều Hành PHT</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome cho Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .transition-all { transition: all 0.25s ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Trái -->
        <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-xl hidden md:flex">
            <div class="p-5 border-b border-slate-800 cursor-pointer hover:bg-slate-800/80 transition-all" onclick="switchTab('dashboard')">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-md text-white text-lg">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-black tracking-wider text-white">GVS EDUHUB</h1>
                        <p class="text-[11px] font-medium text-cyan-400 whitespace-nowrap">Hệ thống Điều hành & Quản lý Chuyên môn</p>
                    </div>
                </div>
            </div>
            
            <nav class="flex-1 p-4 space-y-6 overflow-y-auto text-sm">
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 px-2">1. Điều hành tổng quan</p>
                    <div class="space-y-1.5">
                        <a href="#" onclick="switchTab('dashboard')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-blue-600 text-white font-medium transition-all shadow-md"><i class="fa-solid fa-chart-pie w-5 text-center text-blue-200"></i> Trang chủ / Tổng quan</a>
                        <a href="#" onclick="switchTab('calendar')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-200 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all"><i class="fa-solid fa-calendar-days w-5 text-center text-amber-400"></i> Lịch công tác</a>
                        <a href="#" onclick="switchTab('kanban')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-200 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all"><i class="fa-solid fa-list-check w-5 text-center text-emerald-400"></i> Tiến độ công việc</a>
                    </div>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 px-2">2. Quản lý chuyên môn</p>
                    <div class="space-y-1.5">
                        <a href="#" onclick="switchTab('documents')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-200 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all"><i class="fa-solid fa-folder-open w-5 text-center text-sky-400"></i> Xử lý và lưu trữ VB</a>
                        <a href="#" onclick="switchTab('reports')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-200 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all"><i class="fa-solid fa-chart-line w-5 text-center text-rose-400"></i> Thống kê & báo cáo</a>
                    </div>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 px-2">3. Hệ sinh thái tích hợp</p>
                    <div class="space-y-1.5">
                        <a href="#" onclick="switchTab('app31')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-200 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all text-xs font-medium"><i class="fa-solid fa-book-open-reader w-5 text-center text-amber-400 text-base"></i> 3.1. App soạn KHBD & AI</a>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-y-auto justify-between">
            <div>
                <!-- Header -->
                <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8 shadow-xs">
                    <div class="flex items-center gap-4">
                        <button onclick="switchTab('dashboard')" class="text-slate-600 hover:text-blue-600 transition-all flex items-center gap-1.5 text-sm font-semibold bg-slate-100 hover:bg-blue-50 px-3 py-1.5 rounded-lg shadow-2xs">
                            <i class="fa-solid fa-house"></i> Trang chủ
                        </button>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold shadow-sm">PHT</div>
                    </div>
                </header>

                <!-- Dynamic Content Area -->
                <div id="content-area" class="p-8"></div>
            </div>

            <!-- Chân trang -->
            <footer class="bg-white border-t border-slate-200 py-4 px-8 text-center text-xs text-slate-500 flex items-center justify-center">
                <span class="font-semibold text-slate-700 bg-slate-100 px-4 py-1.5 rounded-lg border border-slate-200 shadow-2xs">
                    Designed with Nguyễn Thị Minh Nhân @2026
                </span>
            </footer>
        </main>
    </div>

    <!-- Thư viện hỗ trợ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <script>
        function switchTab(tabName) {
            const contentEl = document.getElementById('content-area');
            
            if(tabName === 'dashboard') {
                contentEl.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 rounded-2xl p-5 shadow-xs cursor-pointer hover:shadow-md transition-all" onclick="switchTab('documents')">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-[11px] font-bold text-blue-600 uppercase">Văn bản đến</p>
                                <h3 class="text-3xl font-black text-blue-900 mt-1">04</h3>
                            </div>
                            <div class="w-12 h-12 bg-blue-500 text-white rounded-xl flex items-center justify-center text-xl shadow-md"><i class="fa-solid fa-folder-open"></i></div>
                        </div>
                        <p class="text-[11px] text-blue-700 mt-3 font-medium">Bóc tách & phân loại nhanh</p>
                    </div>

                    <div class="bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200 rounded-2xl p-5 shadow-xs cursor-pointer hover:shadow-md transition-all" onclick="switchTab('calendar')">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-[11px] font-bold text-amber-600 uppercase">Lịch công tác</p>
                                <h3 class="text-3xl font-black text-amber-900 mt-1">Tuần này</h3>
                            </div>
                            <div class="w-12 h-12 bg-amber-500 text-white rounded-xl flex items-center justify-center text-xl shadow-md"><i class="fa-solid fa-calendar-days"></i></div>
                        </div>
                        <p class="text-[11px] text-amber-700 mt-3 font-medium">Đọc file Word / PDF</p>
                    </div>

                    <div class="bg-gradient-to-br from-emerald-50 to-teal-50 border border-emerald-200 rounded-2xl p-5 shadow-xs cursor-pointer hover:shadow-md transition-all" onclick="switchTab('kanban')">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-[11px] font-bold text-emerald-600 uppercase">Tiến độ việc</p>
                                <h3 class="text-3xl font-black text-emerald-900 mt-1">Kanban</h3>
                            </div>
                            <div class="w-12 h-12 bg-emerald-500 text-white rounded-xl flex items-center justify-center text-xl shadow-md"><i class="fa-solid fa-list-check"></i></div>
                        </div>
                        <p class="text-[11px] text-emerald-700 mt-3 font-medium">Giám sát tổ chuyên môn</p>
                    </div>

                    <div class="bg-gradient-to-br from-purple-50 to-fuchsia-50 border border-purple-200 rounded-2xl p-5 shadow-xs cursor-pointer hover:shadow-md transition-all" onclick="switchTab('app31')">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-[11px] font-bold text-purple-600 uppercase">Soạn KHBD AI</p>
                                <h3 class="text-3xl font-black text-purple-900 mt-1">Hỗ trợ</h3>
                            </div>
                            <div class="w-12 h-12 bg-purple-500 text-white rounded-xl flex items-center justify-center text-xl shadow-md"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                        </div>
                        <p class="text-[11px] text-purple-700 mt-3 font-medium">Tích hợp năng lực số</p>
                    </div>
                </div>`;
            } 
            else if(tabName === 'documents') {
                contentEl.innerHTML = `
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
                    <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                        <div>
                            <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2"><i class="fa-solid fa-folder-open text-sky-500"></i> Xử Lý Và Lưu Trữ Văn Bản Đến</h3>
                            <p class="text-xs text-slate-500 mt-1">Tóm tắt nhanh văn bản từ Phòng GD&ĐT hoặc UBND để triển khai xuống các tổ chuyên môn.</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="md:col-span-1 space-y-4 bg-slate-50 p-4 rounded-xl border">
                            <h4 class="font-bold text-xs text-slate-700 uppercase">Dán nội dung / Tải VB</h4>
                            <textarea id="docInputContent" rows="6" placeholder="Dán nội dung công văn hoặc quyết định vào đây..." class="w-full p-3 text-xs border rounded-xl outline-none focus:ring-2 focus:ring-sky-400"></textarea>
                            <button onclick="processDocumentText()" class="w-full bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold py-2.5 rounded-xl shadow-sm transition-all">
                                <i class="fa-solid fa-brain mr-1.5"></i> Bóc tách & Tóm tắt bằng AI
                            </button>
                        </div>
                        <div class="md:col-span-2 bg-slate-50 p-4 rounded-xl border flex flex-col justify-between">
                            <div>
                                <h4 class="font-bold text-xs text-slate-700 uppercase mb-3">Kết quả tóm tắt & Hướng chỉ đạo</h4>
                                <div id="docResultArea" class="bg-white p-4 rounded-lg border text-xs text-slate-700 space-y-2 min-h-[160px]">
                                    <p class="text-slate-400 italic">Chưa có văn bản được phân tích. Vui lòng nhập nội dung ở khung bên trái.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }
            else if(tabName === 'app31') {
                contentEl.innerHTML = `
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs max-w-3xl mx-auto">
                    <h3 class="font-bold text-slate-800 text-base mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-book-open-reader text-amber-500"></i> 3.1. Trợ Lý AI Soạn KHBD & Tích Hợp Năng Lực Số
                    </h3>
                    <div class="space-y-4 text-xs">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Tên bài học / Chủ đề:</label>
                            <input type="text" id="ai-lesson" placeholder="Ví dụ: Định luật Ohm - Khoa học tự nhiên 9" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-amber-400 outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">Khối lớp:</label>
                                <select class="w-full p-2.5 border rounded-xl outline-none"><option>Khối 7</option><option>Khối 8</option><option selected>Khối 9</option></select>
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">Ứng dụng Năng lực số đề xuất:</label>
                                <select class="w-full p-2.5 border rounded-xl outline-none"><option>Mô phỏng thí nghiệm ảo PhET</option><option>Bảng tương tác / Padlet</option><option>Trắc nghiệm Kahoot / Quizizz</option></select>
                            </div>
                        </div>
                        <button onclick="alert('AI đã tạo xong cấu trúc 4 hoạt động chuẩn theo Công văn 5512 tích hợp Năng lực số! Sẵn sàng tải về.')" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl transition-all shadow-sm">
                            <i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Tạo Cấu Trúc KHBD & Gợi Ý Tổ Chức
                        </button>
                    </div>
                </div>`;
            }
            else {
                // Giữ nguyên các tab calendar, kanban từ trước
                switchTab('dashboard');
                return;
            }
        }

        function processDocumentText() {
            const text = document.getElementById('docInputContent').value;
            const resultArea = document.getElementById('docResultArea');
            if(!text.trim()) {
                alert("Vui lòng nhập nội dung văn bản cần bóc tách!");
                return;
            }
            resultArea.innerHTML = `
                <p class="font-bold text-sky-700"><i class="fa-solid fa-circle-check"></i> Đã tóm tắt nội dung chính:</p>
                <p class="bg-sky-50 p-2.5 rounded border border-sky-100 text-slate-800">${text.substring(0, 150)}...</p>
                <p class="font-bold text-slate-700 mt-2">📌 Hướng chỉ đạo của BGH:</p>
                <p class="text-slate-600">- Giao Tổ chuyên môn nghiên cứu và triển khai thực hiện trước ngày 15 hàng tháng.</p>`;
        }

        // Khởi chạy mặc định trang chủ
        switchTab('dashboard');
    </script>
</body>
</html>
