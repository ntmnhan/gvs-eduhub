<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GVS Eduhub - Điều Hành PHT</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome cho Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .transition-all { transition: all 0.25s ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Trái -->
        <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-xl hidden md:flex">
            <div class="p-5 border-b border-slate-800 cursor-pointer hover:bg-slate-800/80 transition-all" onclick="switchTab('dashboard')">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-md text-white text-lg">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-black tracking-wider text-white">GVS EDUHUB</h1>
                        <p class="text-[11px] font-medium text-cyan-400 whitespace-nowrap">Hệ thống Điều hành & Quản lý Chuyên môn</p>
                    </div>
                </div>
            </div>
            
            <nav class="flex-1 p-4 space-y-6 overflow-y-auto text-sm">
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 px-2">1. Điều hành tổng quan</p>
                    <div class="space-y-1.5">
                        <a href="#" onclick="switchTab('dashboard')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-blue-600 text-white font-medium transition-all shadow-md"><i class="fa-solid fa-chart-pie w-5 text-center text-blue-200"></i> Trang chủ / Tổng quan</a>
                        <a href="#" onclick="switchTab('calendar')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-200 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all"><i class="fa-solid fa-calendar-days w-5 text-center text-amber-400"></i> Lịch công tác</a>
                        <a href="#" onclick="switchTab('kanban')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-200 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all"><i class="fa-solid fa-list-check w-5 text-center text-emerald-400"></i> Tiến độ công việc</a>
                    </div>
                </div>
                <div>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 px-2">2. Quản lý chuyên môn</p>
                    <div class="space-y-1.5">
                        <a href="#" onclick="switchTab('documents')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-200 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all"><i class="fa-solid fa-folder-open w-5 text-center text-sky-400"></i> Xử lý và lưu trữ VB</a>
                        <a href="#" onclick="switchTab('reports')" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-200 hover:bg-slate-800 hover:text-white hover:translate-x-1 transition-all"><i class="fa-solid fa-chart-line w-5 text-center text-rose-400"></i> Thống kê & báo cáo</a>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-y-auto justify-between">
            <div>
                <!-- Header -->
                <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8 shadow-xs">
                    <div class="flex items-center gap-4">
                        <button onclick="switchTab('dashboard')" class="text-slate-600 hover:text-blue-600 transition-all flex items-center gap-1.5 text-sm font-semibold bg-slate-100 hover:bg-blue-50 px-3 py-1.5 rounded-lg shadow-2xs">
                            <i class="fa-solid fa-house"></i> Trang chủ
                        </button>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold shadow-sm">PHT</div>
                    </div>
                </header>

                <!-- Dynamic Content Area -->
                <div id="content-area" class="p-8"></div>
            </div>

            <!-- Chân trang -->
            <footer class="bg-white border-t border-slate-200 py-4 px-8 text-center text-xs text-slate-500 flex items-center justify-center">
                <span class="font-semibold text-slate-700 bg-slate-100 px-4 py-1.5 rounded-lg border border-slate-200 shadow-2xs">
                    Designed with Nguyễn Thị Minh Nhân @2026
                </span>
            </footer>
        </main>
    </div>

    <!-- Thư viện đọc file Word và PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <script>
        function switchTab(tabName) {
            const contentEl = document.getElementById('content-area');
            
            if(tabName === 'dashboard') {
                contentEl.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200 rounded-2xl p-6 shadow-xs hover:shadow-md transition-all cursor-pointer" onclick="switchTab('calendar')">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-xs font-bold text-amber-600 uppercase tracking-wider">Lịch công tác tuần</p>
                                <h3 class="text-4xl font-black text-amber-900 mt-1">Cập nhật</h3>
                            </div>
                            <div class="w-14 h-14 bg-amber-500 text-white rounded-2xl flex items-center justify-center text-2xl shadow-md"><i class="fa-solid fa-calendar-days"></i></div>
                        </div>
                        <p class="text-xs text-amber-700 mt-4 font-medium flex items-center gap-1"><i class="fa-solid fa-upload"></i> Tải lên file Word hoặc PDF</p>
                    </div>

                    <div class="bg-gradient-to-br from-emerald-50 to-teal-50 border border-emerald-200 rounded-2xl p-6 shadow-xs hover:shadow-md transition-all cursor-pointer" onclick="switchTab('kanban')">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-xs font-bold text-emerald-600 uppercase tracking-wider">Tiến độ công việc</p>
                                <h3 class="text-4xl font-black text-emerald-900 mt-1">Kanban</h3>
                            </div>
                            <div class="w-14 h-14 bg-emerald-500 text-white rounded-2xl flex items-center justify-center text-2xl shadow-md"><i class="fa-solid fa-list-check"></i></div>
                        </div>
                        <p class="text-xs text-emerald-700 mt-4 font-medium flex items-center gap-1"><i class="fa-solid fa-arrow-right"></i> Giám sát nhiệm vụ các tổ</p>
                    </div>
                </div>`;
            } 
            else if(tabName === 'calendar') {
                contentEl.innerHTML = `
                <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
                    <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                        <div>
                            <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2"><i class="fa-solid fa-calendar-days text-amber-500"></i> Lịch Công Tác Tuần</h3>
                            <p class="text-xs text-slate-500 mt-1">Tải lên file lịch tuần định dạng Word (.docx) hoặc PDF (.pdf) để hệ thống tự động tổng hợp.</p>
                        </div>
                    </div>

                    <!-- Ô TẢI FILE WORD / PDF -->
                    <div class="bg-blue-50 border border-blue-200 rounded-xl p-5 mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center text-lg shadow-sm">
                                <i class="fa-solid fa-file-arrow-up"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-slate-800 text-xs uppercase">Cập nhật lịch tự động từ file Word hoặc PDF</h4>
                                <p class="text-[11px] text-slate-500">Hỗ trợ file .docx và .pdf từ văn phòng.</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:w-auto">
                            <input type="file" id="scheduleFileInput" accept=".docx, .pdf" class="hidden" onchange="handleScheduleUpload(event)">
                            <label for="scheduleFileInput" class="cursor-pointer bg-white hover:bg-blue-600 hover:text-white text-blue-600 border border-blue-300 text-xs font-semibold px-4 py-2.5 rounded-xl transition-all shadow-2xs flex items-center justify-center gap-1.5 w-full sm:w-auto">
                                <i class="fa-solid fa-upload"></i> Chọn file lịch tuần
                            </label>
                        </div>
                    </div>

                    <!-- Khu vực hiển thị kết quả lịch -->
                    <div id="calendar-result-area" class="space-y-4">
                        <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl text-center text-slate-500 text-xs">
                            Chưa có file nào được tải lên. Vui lòng chọn file Word hoặc PDF ở trên để hiển thị lịch.
                        </div>
                    </div>
                </div>`;
            }
            else if(tabName === 'kanban') {
                contentEl.innerHTML = `
                <div class="space-y-6">
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2"><i class="fa-solid fa-list-check text-emerald-500"></i> Theo Dõi Tiến Độ Công Việc (Kanban)</h3>
                            <p class="text-xs text-slate-500 mt-1">Giám sát việc thực hiện nhiệm vụ chuyên môn của các Tổ, Bộ phận.</p>
                        </div>
                        <button onclick="alert('Mở form giao việc mới cho bộ phận.')" class="bg-emerald-600 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-sm"><i class="fa-solid fa-plus"></i> Giao việc mới</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-slate-100 p-4 rounded-2xl border">
                            <h4 class="text-xs font-bold text-slate-700 uppercase mb-3 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span> Chờ triển khai (2)</h4>
                            <div class="space-y-3">
                                <div class="bg-white p-3.5 rounded-xl border shadow-2xs">
                                    <span class="text-[10px] font-bold text-purple-600 bg-purple-50 px-2 py-0.5 rounded">TỔ KHTN</span>
                                    <h5 class="font-bold text-slate-800 text-xs mt-1">Nộp ma trận & đề kiểm tra giữa kỳ 2</h5>
                                    <span class="text-[10px] text-red-500 font-medium block mt-2"><i class="fa-regular fa-clock"></i> Hạn: 15/03</span>
                                </div>
                            </div>
                        </div>
                        <div class="bg-blue-50 p-4 rounded-2xl border border-blue-200">
                            <h4 class="text-xs font-bold text-blue-700 uppercase mb-3 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span> Đang thực hiện (1)</h4>
                            <div class="space-y-3">
                                <div class="bg-white p-3.5 rounded-xl border shadow-2xs">
                                    <span class="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded">THƯ VIỆN</span>
                                    <h5 class="font-bold text-slate-800 text-xs mt-1">Kiểm kê thiết bị thực hành Lý - Hóa</h5>
                                    <span class="text-[10px] text-amber-600 font-medium block mt-2"><i class="fa-regular fa-clock"></i> Hạn: 10/03</span>
                                </div>
                            </div>
                        </div>
                        <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200">
                            <h4 class="text-xs font-bold text-emerald-700 uppercase mb-3 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Đã hoàn thành (1)</h4>
                            <div class="space-y-3">
                                <div class="bg-white p-3.5 rounded-xl border shadow-2xs opacity-75">
                                    <span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">TOÀN TRƯỜNG</span>
                                    <h5 class="font-bold text-slate-800 text-xs mt-1 line-through">Đăng ký danh sách thi HSG cấp Quận</h5>
                                    <span class="text-[10px] text-emerald-600 font-semibold block mt-2"><i class="fa-solid fa-check"></i> Đã hoàn tất</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }
            else {
                contentEl.innerHTML = `<div class="bg-white rounded-2xl border p-8 text-center text-slate-500">Module đang được phát triển theo yêu cầu quản lý chuyên môn.</div>`;
            }
        }

        // Hàm xử lý file tải lên (Word hoặc PDF)
        async function handleScheduleUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const resultArea = document.getElementById('calendar-result-area');
            resultArea.innerHTML = `<div class="p-4 bg-blue-50 text-blue-700 rounded-xl text-center text-xs"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Đang đọc và bóc tách nội dung file ${file.name}...</div>`;

            const fileName = file.name.toLowerCase();

            try {
                if (fileName.endsWith('.docx')) {
                    const reader = new FileReader();
                    reader.onload = function(loadEvent) {
                        mammoth.convertToHtml({ arrayBuffer: loadEvent.target.result })
                            .then(result => renderScheduleResult(file.name, result.value))
                            .catch(err => alert("Lỗi đọc file Word: " + err.message));
                    };
                    reader.readAsArrayBuffer(file);
                } 
                else if (fileName.endsWith('.pdf')) {
                    const reader = new FileReader();
                    reader.onload = async function(loadEvent) {
                        const typedarray = new Uint8Array(loadEvent.target.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        let fullText = "";
                        
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            const pageText = textContent.items.map(item => item.str).join(" ");
                            fullText += `<p class="mb-2">${pageText}</p>`;
                        }
                        renderScheduleResult(file.name, fullText);
                    };
                    reader.readAsArrayBuffer(file);
                } else {
                    alert("Định dạng file không hỗ trợ. Vui lòng chọn file .docx hoặc .pdf");
                    resultArea.innerHTML = `<div class="p-4 bg-slate-50 text-slate-500 rounded-xl text-center text-xs">Vui lòng chọn file đúng định dạng.</div>`;
                }
            } catch (error) {
                alert("Đã xảy ra lỗi khi xử lý file.");
            }
        }

        function renderScheduleResult(fileName, htmlContent) {
            const resultArea = document.getElementById('calendar-result-area');
            resultArea.innerHTML = `
                <div class="p-5 bg-emerald-50 border border-emerald-200 rounded-xl">
                    <div class="flex justify-between items-center mb-3">
                        <h4 class="font-bold text-emerald-800 text-xs uppercase flex items-center gap-2">
                            <i class="fa-solid fa-circle-check"></i> Đã đồng bộ thành công từ: ${fileName}
                        </h4>
                        <span class="text-[10px] bg-emerald-200 text-emerald-800 px-2 py-0.5 rounded font-semibold">Sẵn sàng điều hành</span>
                    </div>
                    <div class="text-xs text-slate-700 bg-white p-4 rounded-lg border border-emerald-100 max-h-96 overflow-y-auto leading-relaxed">
                        ${htmlContent}
                    </div>
                </div>`;
        }

        // Khởi chạy mặc định trang chủ
        switchTab('dashboard');
    </script>
</body>
</html>
